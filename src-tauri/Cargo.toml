[package]
name = "vrav-tube-engine"
version = "0.1.0"
description = "VRAV Tube Engine — YouTube AI Audit & Monetization"
authors = ["VRAV"]
edition = "2021"

[lib]
name = "vrav_tube_engine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
