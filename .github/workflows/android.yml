name: Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install npm deps
        run: npm install

      - name: Build web assets (required for Capacitor)
        run: npm run build

      - name: Upload web dist (APK needs local Android SDK / Capacitor project)
        uses: actions/upload-artifact@v4
        with:
          name: vrav-web-for-android
          path: dist

      - name: Note
        run: |
          echo "Full APK build requires android/ project from: npx cap add android"
          echo "Web dist is uploaded; run Capacitor locally or add committed android/ scaffold."
