name: Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm deps
        run: npm install

      - name: Sync version from package.json
        run: node scripts/sync-version.mjs || true

      - name: Install Capacitor
        run: |
          npm install -D @capacitor/cli @capacitor/core
          npm install @capacitor/android @capacitor/app

      - name: Build web assets
        run: npm run build

      - name: Capacitor sync Android
        run: npx cap add android || true
        continue-on-error: true

      - name: Cap sync
        run: npx cap sync android || true
        continue-on-error: true

      - name: Build debug APK
        working-directory: android
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            echo "Android project not fully initialized — skipping APK"
            exit 0
          fi
        continue-on-error: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vrav-android-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
