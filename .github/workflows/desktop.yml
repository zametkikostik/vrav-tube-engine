name: Desktop Build (Windows + Linux)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libwebkit2gtk-4.0-dev \
            build-essential \
            curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm install

      - name: Install Tauri CLI
        run: npm install -D @tauri-apps/cli@2

      - name: Generate icons (required by tauri build)
        run: |
          python -m pip install Pillow -q
          python scripts/generate-icons.py
          test -f src-tauri/icons/32x32.png
          test -f src-tauri/icons/icon.ico
          test -f src-tauri/icons/icon.png
          ls -la src-tauri/icons/

      - name: Sync version
        run: node scripts/sync-version.mjs || true

      - name: Build Tauri (Linux)
        run: npm run tauri build
        env:
          CI: true
          TAURI_SIGNING_PRIVATE_KEY: ''

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vrav-desktop-linux
          path: |
            src-tauri/target/release/bundle/appimage/**
            src-tauri/target/release/bundle/deb/**
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm install

      - name: Install Tauri CLI
        run: npm install -D @tauri-apps/cli@2

      - name: Generate icons (required by tauri-build on Windows)
        shell: bash
        run: |
          python -m pip install Pillow -q
          python scripts/generate-icons.py
          test -f src-tauri/icons/32x32.png
          test -f src-tauri/icons/icon.ico
          ls -la src-tauri/icons/

      - name: Sync version
        run: node scripts/sync-version.mjs || true

      - name: Build Tauri (Windows)
        run: npm run tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vrav-desktop-windows
          path: |
            src-tauri/target/release/bundle/msi/**
            src-tauri/target/release/bundle/nsis/**
          if-no-files-found: warn
